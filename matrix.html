<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrix Calculator | MathGenius</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .matrix-page {
            width: min(100% - 30px, 1000px);
            margin: 35px auto;
        }

        .matrix-navigation {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .matrix-navigation a {
            color: #91aaff;
            text-decoration: none;
        }

        .matrix-card {
            background: rgba(35, 53, 85, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .matrix-dimensions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .matrix-dimensions label {
            display: grid;
            gap: 7px;
        }

        .matrix-dimensions select {
            padding: 10px;
            border-radius: 7px;
            background: #17243e;
            color: white;
            border: 1px solid #52658b;
        }

        .matrix-grid {
            display: grid;
            gap: 8px;
            margin-top: 15px;
        }

        .matrix-grid input {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 12px 5px;
            background: #101a30;
            color: white;
            border: 1px solid #52658b;
            border-radius: 7px;
            text-align: center;
        }

        .matrix-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .matrix-actions button {
            padding: 13px 8px;
            border: none;
            border-radius: 8px;
            background: #493d83;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .matrix-actions button:hover {
            background: #6555ad;
        }

        #matrixError {
            display: none;
            color: #ff8d9b;
            margin: 15px 0;
        }

        #matrixResult {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        #matrixResult pre {
            padding: 15px;
            border-radius: 10px;
            background: #101a30;
            color: #75e0b0;
            font-size: 16px;
        }

        @media(max-width: 600px) {
            .matrix-card {
                padding: 15px;
            }

            .matrix-actions {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <main class="matrix-page">

        <nav class="matrix-navigation">
            <a href="./dashboard.html">← Dashboard</a>
            <a href="./history.html">Saved Calculations →</a>
        </nav>

        <h1>Matrix Calculator</h1>

        <p style="margin: 10px 0 25px;">
            Perform matrix operations quickly and accurately.
        </p>


        <!-- MATRIX A -->
        <section class="matrix-card">

            <h2>Matrix A</h2>

            <div class="matrix-dimensions">

                <label>
                    Rows
                    <select id="rowsA">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>

                <label>
                    Columns
                    <select id="colsA">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>

            </div>

            <div id="matrixAGrid" class="matrix-grid"></div>

        </section>


        <!-- MATRIX B -->
        <section class="matrix-card">

            <h2>Matrix B</h2>

            <div class="matrix-dimensions">

                <label>
                    Rows
                    <select id="rowsB">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>

                <label>
                    Columns
                    <select id="colsB">
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </label>

            </div>

            <div id="matrixBGrid" class="matrix-grid"></div>

        </section>


        <!-- OPERATIONS -->
        <section class="matrix-card">

            <h2>Matrix Operations</h2>

            <div class="matrix-actions">

                <button id="addButton">A + B</button>

                <button id="subtractButton">A − B</button>

                <button id="multiplyButton">A × B</button>

                <button id="transposeAButton">
                    Transpose A
                </button>

                <button id="transposeBButton">
                    Transpose B
                </button>

                <button id="determinantAButton">
                    Determinant A
                </button>

                <button id="determinantBButton">
                    Determinant B
                </button>

                <button id="inverseAButton">
                    Inverse A
                </button>

                <button id="inverseBButton">
                    Inverse B
                </button>

            </div>

            <p id="matrixError"></p>

            <div id="matrixResult"></div>

        </section>


        <section class="matrix-card">
            <h3>Saved Calculations</h3>

            <p>
                Successful matrix operations are automatically
                saved to your MathGenius history.
            </p>

            <br>

            <a href="./history.html">View Mathematics History →</a>
        </section>

    </main>


    <!-- Account system -->
    <script src="./auth.js"></script>

    <!-- Saved history system -->
    <script src="./history.js"></script>

    <!-- Matrix calculator -->
    <script src="./matrix.js"></script>

</body>
</html>
