<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1c">

    <title>Create Account | MathGenius</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #080d1c;
            --card: rgba(17, 26, 48, 0.78);
            --blue: #4776ff;
            --purple: #9b6dff;
            --cyan: #45d7ff;
            --text: #f4f6ff;
            --muted: #9ba9c7;
            --border: rgba(123, 151, 255, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(71, 118, 255, 0.19), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(155, 109, 255, 0.17), transparent 35%),
                linear-gradient(135deg, #070b18, #0b1530 55%, #080d1c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 16px;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            pointer-events: none;
        }

        body::before {
            background: var(--blue);
            top: -120px;
            left: -100px;
        }

        body::after {
            background: var(--purple);
            bottom: -130px;
            right: -100px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
            perspective: 1200px;
        }

        .auth-card {
            position: relative;
            width: 100%;
            padding: 38px 32px;
            border-radius: 25px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.42),
                inset 0 1px 1px rgba(255, 255, 255, 0.08),
                0 0 35px rgba(71, 118, 255, 0.08);
            overflow: hidden;
            animation: cardAppear 1s ease both;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(69, 215, 255, 0.7),
                transparent 35%,
                rgba(155, 109, 255, 0.65)
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }

        .auth-card > * {
            position: relative;
            z-index: 1;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 27px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 14px;
            border-radius: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 25px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            box-shadow:
                0 8px 25px rgba(71, 118, 255, 0.35),
                inset 0 1px 2px rgba(255, 255, 255, 0.35);
        }

        .brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand h1 span {
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 7px;
        }

        .form-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            margin-bottom: 7px;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #dce5ff;
        }

        .input-wrap {
            position: relative;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 49px;
            padding: 0 15px;
            border-radius: 12px;
            outline: none;
            border: 1px solid rgba(133, 157, 220, 0.22);
            background: rgba(5, 12, 29, 0.65);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .form-group input::placeholder {
            color: #71809f;
        }

        .form-group select {
            cursor: pointer;
            color: #dce5ff;
        }

        .form-group select option {
            background: #111a30;
            color: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--cyan);
            box-shadow:
                0 0 0 3px rgba(69, 215, 255, 0.09),
                0 0 18px rgba(69, 215, 255, 0.13);
            background: rgba(8, 17, 39, 0.9);
        }

        .password-hint {
            display: block;
            color: #8999ba;
            font-size: 11px;
            margin-top: 7px;
        }

        .auth-button {
            width: 100%;
            height: 51px;
            margin-top: 9px;
            border: none;
            border-radius: 13px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            background: linear-gradient(110deg, #4776ff, #7658ff, #9b6dff);
            background-size: 200% 200%;
            box-shadow: 0 9px 25px rgba(71, 118, 255, 0.28);
            transition: 0.35s ease;
            animation: gradientMove 5s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .auth-button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 13px 30px rgba(71, 118, 255, 0.42),
                0 0 20px rgba(155, 109, 255, 0.2);
        }

        .auth-button:active {
            transform: scale(0.98);
        }

        .auth-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;
            margin-top: 15px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .auth-message.success {
            display: block;
            color: #80f0bd;
            background: rgba(22, 163, 74, 0.12);
            border: 1px solid rgba(22, 163, 74, 0.25);
        }

        .auth-message.error {
            display: block;
            color: #ff9aab;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .auth-footer {
            text-align: center;
            margin-top: 23px;
            color: var(--muted);
            font-size: 13px;
        }

        .auth-footer a {
            color: var(--cyan);
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            color: white;
            text-shadow: 0 0 12px var(--cyan);
        }

        .bottom-note {
            text-align: center;
            color: #647493;
            font-size: 11px;
            margin-top: 22px;
        }

        /* 3D OPENING DOOR INTRO */

        .mg-intro {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070b18;
            perspective: 1400px;
            overflow: hidden;
            animation: introDisappear 0.8s ease 1.8s forwards;
        }

        .mg-door {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(145deg, #101d3c, #080d1c);
            border: 1px solid rgba(69, 215, 255, 0.25);
            box-shadow: inset 0 0 50px rgba(71, 118, 255, 0.12);
        }

        .mg-door-left {
            left: 0;
            transform-origin: left center;
            animation: openLeftDoor 1.5s cubic-bezier(.7, 0, .2, 1) 0.3s forwards;
        }

        .mg-door-right {
            right: 0;
            transform-origin: right center;
            animation: openRightDoor 1.5s cubic-bezier(.7, 0, .2, 1) 0.3s forwards;
        }

        .mg-intro-brand {
            position: relative;
            z-index: 2;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            animation: brandDisappear 0.5s ease 1.2s forwards;
        }

        .mg-intro-brand strong {
            display: block;
            font-size: 36px;
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .mg-intro-brand span {
            color: #a8b7d9;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        @keyframes openLeftDoor {
            to {
                transform: rotateY(-105deg);
            }
        }

        @keyframes openRightDoor {
            to {
                transform: rotateY(105deg);
            }
        }

        @keyframes brandDisappear {
            to {
                opacity: 0;
                transform: scale(1.3);
            }
        }

        @keyframes introDisappear {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 22px 13px;
            }

            .auth-card {
                padding: 30px 21px;
                border-radius: 21px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .form-title {
                font-size: 21px;
            }

            .mg-intro-brand strong {
                font-size: 29px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Opening Door Animation -->
    <div class="mg-intro" id="mgIntro">
        <div class="mg-door mg-door-left"></div>
        <div class="mg-door mg-door-right"></div>

        <div class="mg-intro-brand">
            <strong>MathGenius</strong>
            <span>Think Beyond Limits</span>
        </div>
    </div>

    <main class="auth-wrapper">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">M</div>

                <h1>Math<span>Genius</span></h1>

                <p>Your intelligent mathematics companion</p>
            </div>

            <h2 class="form-title">Create Your Account</h2>

            <p class="form-subtitle">
                Join MathGenius and take your learning further
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="accountType">Account Type</label>

                    <select id="accountType" name="accountType" required>
                        <option value="" disabled selected>
                            Select your account type
                        </option>

                        <option value="Student">Student</option>
                        <option value="Lecturer">Lecturer</option>
                        <option value="Researcher">Researcher</option>
                        <option value="Mathematician">Mathematician</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="institution">Institution / School</label>

                    <input
                        type="text"
                        id="institution"
                        name="institution"
                        placeholder="Enter your institution or school"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        required
                    >

                    <small class="password-hint">
                        Use a strong password that you can remember.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Create Account
                </button>

                <div
                    id="authMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </div>

            <div class="bottom-note">
                © 2026 MathGenius · Learn Without Limits
            </div>

        </section>

    </main>

    <script src="auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const intro = document.getElementById("mgIntro");

            if (intro) {
                setTimeout(function () {
                    intro.remove();
                }, 2600);
            }
        });
    </script>

</body>
</html>
