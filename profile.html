<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1c">

    <title>My Profile | MathGenius</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .profile-container {
            width: min(750px, 92%);
            margin: 40px auto;
        }

        .back-link {
            display: inline-block;
            color: #a8a6ff;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .profile-card {
            background: #141d37;
            border: 1px solid #303d60;
            border-radius: 18px;
            padding: 28px;
            margin-top: 25px;
        }

        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #536dfe, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .profile-card h2 {
            margin-bottom: 8px;
        }

        .profile-description {
            color: #aebbd8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #dce3f5;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #39466b;
            background: #0b1328;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #7775ff;
        }

        .form-group input:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .profile-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #536dfe, #9333ea);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .profile-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .profile-message {
            margin-top: 15px;
            font-size: 14px;
        }

        .account-info {
            background: #0b1328;
            padding: 18px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .account-info p {
            color: #aebbd8;
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .account-info strong {
            color: white;
        }

        .danger-button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 1px solid #e5484d;
            border-radius: 9px;
            background: transparent;
            color: #ff8585;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width: 500px) {
            .profile-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">MathGenius</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main class="profile-container">

        <a href="dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

        <h1>My Profile</h1>

        <p class="profile-description">
            Manage your personal information and account details.
        </p>

        <section class="profile-card">

            <div class="profile-avatar" id="profileAvatar">M</div>

            <h2 id="profileDisplayName">My Account</h2>

            <p class="profile-description">
                Your personal MathGenius account.
            </p>

            <form id="profileForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        disabled
                    >
                </div>

                <div class="form-group">
                    <label for="accountType">Account Category</label>

                    <select id="accountType" disabled>
                        <option value="student">Student</option>
                        <option value="lecturer">Lecturer</option>
                        <option value="researcher">Researcher</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="institution">School / Institution</label>

                    <input
                        type="text"
                        id="institution"
                        placeholder="Enter your institution"
                    >
                </div>

                <button
                    type="submit"
                    class="profile-button"
                    id="saveProfileButton"
                >
                    Save Changes
                </button>

                <p
                    id="profileMessage"
                    class="profile-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <div class="account-info">

                <h3>Account Information</h3>

                <p>
                    <strong>Account ID:</strong>
                    <span id="accountId">Loading...</span>
                </p>

                <p>
                    <strong>Member Since:</strong>
                    <span id="createdAt">Loading...</span>
                </p>

            </div>

            <button
                type="button"
                class="danger-button"
                id="logoutButton"
            >
                Log Out
            </button>

        </section>

    </main>

    <script src="./auth.js"></script>
    <script src="./profile.js"></script>

</body>
</html>
