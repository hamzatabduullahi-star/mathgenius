<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator | MathGenius</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .calculator-page {
            width: min(100% - 30px, 600px);
            margin: 40px auto;
        }

        .calculator-card {
            padding: 25px;
            border-radius: 18px;
            background: rgba(35, 53, 85, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .calculator-display {
            padding: 20px;
            min-height: 110px;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #101a30;
            overflow-wrap: anywhere;
            text-align: right;
        }

        #expression {
            min-height: 25px;
            opacity: 0.7;
            font-size: 17px;
        }

        #result {
            margin-top: 12px;
            font-size: 30px;
            font-weight: bold;
            color: #75e0b0;
        }

        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            min-height: 58px;
            border: none;
            border-radius: 10px;
            background: #263b61;
            color: white;
            font-size: 19px;
            cursor: pointer;
        }

        .calc-btn:hover {
            background: #36558a;
        }

        .calc-btn.operator {
            background: #493d83;
        }

        .calc-btn.action {
            background: #a43e53;
        }

        .calc-btn.equal {
            background: #087e68;
        }

        .calculator-navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .calculator-navigation a {
            color: #91aaff;
            text-decoration: none;
        }

        .history-note {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(20, 35, 60, 0.8);
            font-size: 14px;
        }

        @media (max-width: 450px) {
            .calculator-card {
                padding: 15px;
            }

            .calc-btn {
                min-height: 52px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="calculator-page">

        <nav class="calculator-navigation">
            <a href="./dashboard.html">← Dashboard</a>
            <a href="./history.html">Saved Calculations →</a>
        </nav>

        <h1>Scientific Calculator</h1>

        <p style="margin: 10px 0 20px;">
            Calculate smarter with MathGenius.
        </p>

        <section class="calculator-card">

            <div class="calculator-display">
                <div id="expression">0</div>
                <div id="result">0</div>
            </div>

            <div class="calculator-buttons">

                <button class="calc-btn action"
                    data-action="clear">AC</button>

                <button class="calc-btn action"
                    data-action="delete">DEL</button>

                <button class="calc-btn operator"
                    data-value="%">%</button>

                <button class="calc-btn operator"
                    data-value="/">÷</button>

                <button class="calc-btn"
                    data-value="7">7</button>

                <button class="calc-btn"
                    data-value="8">8</button>

                <button class="calc-btn"
                    data-value="9">9</button>

                <button class="calc-btn operator"
                    data-value="*">×</button>

                <button class="calc-btn"
                    data-value="4">4</button>

                <button class="calc-btn"
                    data-value="5">5</button>

                <button class="calc-btn"
                    data-value="6">6</button>

                <button class="calc-btn operator"
                    data-value="-">−</button>

                <button class="calc-btn"
                    data-value="1">1</button>

                <button class="calc-btn"
                    data-value="2">2</button>

                <button class="calc-btn"
                    data-value="3">3</button>

                <button class="calc-btn operator"
                    data-value="+">+</button>

                <button class="calc-btn"
                    data-value="(">(</button>

                <button class="calc-btn"
                    data-value="0">0</button>

                <button class="calc-btn"
                    data-value=")">)</button>

                <button class="calc-btn"
                    data-value=".">.</button>

                <button class="calc-btn operator"
                    data-value="^">xʸ</button>

                <button class="calc-btn operator"
                    data-value="sqrt(">√</button>

                <button class="calc-btn operator"
                    data-value="sin(">sin</button>

                <button class="calc-btn operator"
                    data-value="cos(">cos</button>

                <button class="calc-btn operator"
                    data-value="tan(">tan</button>

                <button class="calc-btn operator"
                    data-value="log(">log</button>

                <button class="calc-btn operator"
                    data-value="pi">π</button>

                <button class="calc-btn operator"
                    data-value="e">e</button>

                <button class="calc-btn equal"
                    data-action="calculate">=</button>

            </div>

            <div class="history-note">
                Your successful calculations are automatically saved
                to your MathGenius account history.
                <br><br>
                <a href="./history.html">View saved calculations</a>
            </div>

        </section>

    </main>

    <!-- Mathematics engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.min.js"></script>

    <!-- Account and history systems -->
    <script src="./auth.js"></script>
    <script src="./history.js"></script>

    <!-- Calculator -->
    <script src="./calculator.js"></script>

</body>
</html>
